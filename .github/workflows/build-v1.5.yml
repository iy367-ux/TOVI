name: Build TOVI v1.5 APK

on:
  push:
    branches: ["v1.5-functional"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TOVI v1.5 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.5 source
        uses: actions/checkout@v4
        with:
          ref: v1.5-functional

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build TOVI v1.5
        run: gradle --no-daemon clean assembleDebug

      - name: Upload TOVI v1.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: TOVI-v1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
