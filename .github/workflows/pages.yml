name: Deploy TOVI website

on:
  push:
    branches: [ "main" ]
    paths:
      - "README.md"
      - "index.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Wait for artifact indexing
        run: sleep 15
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
